[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitforge"
version = "0.2.0"
description = "CircuitForge: Open-Source Weight-Space Circuit Surgery, Representation Engineering, and Verifiable RL Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Adam Murphy"}
]
dependencies = [
  "numpy>=1.24.0",
]

[project.scripts]
circuitforge = "circuitforge.cli:main"

[project.optional-dependencies]
torch = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "safetensors>=0.4.0",
]
dev = [
  "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
